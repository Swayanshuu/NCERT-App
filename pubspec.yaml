name: ncert_books_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  http: ^1.6.0
  archive: ^4.2.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  pdfrx: ^2.4.7
  auto_size_text: ^3.0.0
  google_mobile_ads: ^9.1.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  oc_liquid_glass: ^0.3.0
  flutter_bloc: ^8.1.6
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: "ic_launcher"
